name: Mirror to Public
on:
  push:
    # main, replit-agent 포함, 그 외 브랜치도 허용
    branches:
      - main
      - replit-agent
      - '**'
  workflow_dispatch: {}
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to public mirror
        env:
          MIRROR_URL: https://github.com/beaulead-james/beaulead-ai-public.git
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "Mirror Bot"
          git config user.email "bot@beaulead.co.kr"
          # 기존에 mirror가 있으면 교체
          git remote remove mirror 2>/dev/null || true
          git remote add mirror https://$GH_PAT@${MIRROR_URL#https://}
          # 원본의 main이 없을 수도 있으므로, 현재 체크아웃된 브랜치명을 감지
          SRC_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          echo "Source branch: $SRC_BRANCH"
          # public 저장소는 main으로 고정
          git push --force --prune mirror "$SRC_BRANCH:main"