name: Mirror to Public
on:
  push:
    branches:
      - main
      - replit-agent
      - '**'
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to public mirror
        env:
          MIRROR_URL: https://github.com/beaulead-james/beaulead-ai-public.git
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "Mirror Bot"
          git config --global user.email "bot@beaulead.co.kr"

          # Add mirror remote (HTTPS + token)
          git remote remove mirror 2>/dev/null || true
          git remote add mirror https://x-access-token:${GH_PAT}@github.com/beaulead-james/beaulead-ai-public.git

          # 현재 브랜치(main/replit-agent)를 public main으로 강제 동기화
          SRC_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          echo "Pushing $SRC_BRANCH -> main"
          git push --force --prune mirror "$SRC_BRANCH:main"