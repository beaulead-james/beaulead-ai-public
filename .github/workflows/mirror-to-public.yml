name: Mirror to Public
on:
  push:
    branches:
      - main
      - replit-agent
      - '**'
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "Mirror Bot"
          git config --global user.email "bot@beaulead.co.kr"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Push to public mirror (force)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          MIRROR_URL: beaulead-james/beaulead-ai-public.git
        run: |
          test -n "$GH_PAT" || { echo "::error::GH_PAT secret missing"; exit 1; }
          SRC_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          echo "Source branch: $SRC_BRANCH"
          REMOTE_URL="https://x-access-token:${GH_PAT}@github.com/${MIRROR_URL}"
          git remote remove mirror 2>/dev/null || true
          git remote add mirror "$REMOTE_URL"
          # public repo는 항상 main으로 받도록 고정
          git push --force --prune mirror "$SRC_BRANCH:main"